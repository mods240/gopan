name: Sync Bakeries from OpenStreetMap

on:
  workflow_dispatch:
    inputs:
      region:
        description: '同期するリージョン (all / 関西 / 関東 / 中京 / 北陸・信越 / 東北 / 中国・四国 / 九州 / 北海道 / 沖縄)'
        required: false
        default: 'all'
  schedule:
    - cron: '0 2 1 * *' # 毎月1日の午前2時

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js ws

      - name: Run sync script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_REGION: ${{ github.event.inputs.region || 'all' }}
        run: node scripts/sync-bakeries.mjs
