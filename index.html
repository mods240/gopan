    function deleteOneDuplicate(eqId) {
      const eq = appState.equipment.find(e => e.id === eqId);
      if (!eq) return;
      if (!confirm(`機材「${eq.name}」(カテゴリ: ${eq.category})を削除しますか?`)) return;
      
      appState.equipment = appState.equipment.filter(e => e.id !== eqId);
      saveState();
      closeModal();
      
      setTimeout(() => checkDuplicates(), 100);
    }
    
    // === 個別管理に変換(連番付与)===
    function convertToIndividual(name) {
      const items = appState.equipment.filter(eq => eq.name === name);
      if (items.length <= 1) return;
      
      // 既に同名連番があるか確認(例: α7 IV-01 がすでに存在するか)
      const existingNumbered = appState.equipment.filter(eq => 
        eq.name.match(new RegExp(`^${escapeRegex(name)}-\\d+$`))
      );
      let startNum = 1;
      if (existingNumbered.length > 0) {
        const numbers = existingNumbered.map(eq => {
          const m = eq.name.match(/-(\d+)$/);
          return m ? parseInt(m[1]) : 0;
        });
        startNum = Math.max(...numbers) + 1;
      }
      
      const preview = items.map((eq, idx) => `${name}-${String(startNum + idx).padStart(2, '0')}`).join('\n');
      
      if (!confirm(`機材「${name}」の${items.length}件を個別管理に変換します。\n\n` +
                   `変換後の機材名:\n${preview}\n\n` +
                   `各機材の在庫数は1のまま、機材名に連番が付与されます。\n続行しますか?`)) return;
      
      // 各機材に連番を付与
      items.forEach((eq, idx) => {
        eq.name = `${name}-${String(startNum + idx).padStart(2, '0')}`;
      });
      
      saveState();
      closeModal();
      renderEquipment();
      
      setTimeout(() => {
        alert(`機材「${name}」を${items.length}件の個別機材に変換しました\n\n例: ${items[0].name}, ${items[1].name}...`);
        checkDuplicates();
      }, 100);
    }
    
    // === すべて個別管理に変換 ===
    function convertAllToIndividual() {
      const nameMap = {};
      appState.equipment.forEach(eq => {
        const name = eq.name;
        if (!nameMap[name]) nameMap[name] = [];
        nameMap[name].push(eq);
      });
      
      const duplicates = Object.entries(nameMap)
        .filter(([name, items]) => items.length > 1);
      
      if (duplicates.length === 0) return;
      
      const totalItems = duplicates.reduce((sum, [name, items]) => sum + items.length, 0);
      
      // プレビュー作成(最初の3つだけ)
      const previewLines = [];
      duplicates.slice(0, 3).forEach(([name, items]) => {
        items.forEach((eq, idx) => {
          previewLines.push(`${name}-${String(idx + 1).padStart(2, '0')}`);
        });
      });
      const preview = previewLines.join('\n') + (duplicates.length > 3 ? '\n...' : '');
      
      if (!confirm(`${duplicates.length}種類の重複機材(合計${totalItems}件)を個別管理に変換します。\n\n` +
                   `各機材に連番が付与されます。\n\n` +
                   `例:\n${preview}\n\n` +
                   `⚠️ この操作は取り消せません。事前にバックアップを取ることを推奨します。\n\n続行しますか?`)) return;
      
      let convertedCount = 0;
      
      duplicates.forEach(([name, items]) => {
        // 既存の連番をチェック
        const existingNumbered = appState.equipment.filter(eq => 
          eq.name.match(new RegExp(`^${escapeRegex(name)}-\\d+$`))
        );
        let startNum = 1;
        if (existingNumbered.length > 0) {
          const numbers = existingNumbered.map(eq => {
            const m = eq.name.match(/-(\d+)$/);
            return m ? parseInt(m[1]) : 0;
          });
          startNum = Math.max(...numbers) + 1;
        }
        
        items.forEach((eq, idx) => {
          eq.name = `${name}-${String(startNum + idx).padStart(2, '0')}`;
          convertedCount++;
        });
      });
      
      saveState();
      closeModal();
      renderEquipment();
      
      setTimeout(() => {
        alert(`✅ 一括変換完了!\n\n${duplicates.length}種類の重複を解消し、${convertedCount}件の機材を個別管理に変換しました。`);
      }, 100);
    }
    
    // 正規表現用のエスケープ
    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    
    function mergeDuplicates(name) {
      const items = appState.equipment.filter(eq => eq.name === name);
      if (items.length <= 1) return;
      
      if (!confirm(`機材「${name}」の${items.length}件を統合します。\n` +
                   `在庫数を合算し、最初の1件以外を削除します。\n\n` +
                   `※消耗品など、まとめて管理したい場合に推奨\n` +
                   `※個別管理したい場合は「個別管理に変換」を選択してください\n\n続行しますか?`)) return;
      
      const merged = { ...items[0] };
      merged.stock = items.reduce((sum, eq) => sum + (eq.stock || 1), 0);
      
      const notes = items.map(eq => eq.note).filter(n => n);
      if (notes.length > 1) {
        merged.note = notes.join(' / ');
      }
      
      const ids = items.map(eq => eq.id);
      appState.equipment = appState.equipment.filter(eq => !ids.includes(eq.id));
      appState.equipment.push(merged);
      
      saveState();
      closeModal();
      
      setTimeout(() => {
        alert(`機材「${name}」を統合しました(在庫数: ${merged.stock})`);
        checkDuplicates();
      }, 100);
    }
    
    function mergeAllDuplicates() {
      const nameMap = {};
      appState.equipment.forEach(eq => {
        const name = eq.name;
        if (!nameMap[name]) nameMap[name] = [];
        nameMap[name].push(eq);
      });
      
      const duplicates = Object.entries(nameMap)
        .filter(([name, items]) => items.length > 1);
      
      if (duplicates.length === 0) return;
      
      const totalExcess = duplicates.reduce((sum, [name, items]) => sum + items.length - 1, 0);
      
      if (!confirm(`${duplicates.length}件の重複機材を統合します。\n` +
                   `在庫数を合算し、${totalExcess}件の機材が削除されます。\n\n` +
                   `※消耗品など、まとめて管理する方式\n` +
                   `※個別管理したい場合は「個別管理に変換」を選択してください\n\n` +
                   `⚠️ この操作は取り消せません。事前にバックアップを取ることを推奨します。\n\n続行しますか?`)) return;
      
      let mergedCount = 0;
      
      duplicates.forEach(([name, items]) => {
        const merged = { ...items[0] };
        merged.stock = items.reduce((sum, eq) => sum + (eq.stock || 1), 0);
        
        const notes = items.map(eq => eq.note).filter(n => n);
        if (notes.length > 1) {
          merged.note = notes.join(' / ');
        }
        
        const ids = items.map(eq => eq.id);
        appState.equipment = appState.equipment.filter(eq => !ids.includes(eq.id));
        appState.equipment.push(merged);
        mergedCount++;
      });
      
      saveState();
      closeModal();
      
      setTimeout(() => {
        alert(`✅ 一括統合完了!\n\n${mergedCount}件の機材を統合し、${totalExcess}件の重複を解消しました。`);
        renderEquipment();
      }, 100);
    }

    // === Excel Export (シート分け対応・カテゴリ別のみ) ===
    function exportExcel() {
      if (typeof XLSX === 'undefined') {
        alert('Excelライブラリが読み込まれていません。ページをリロードしてください。');
        return;
      }
      
      if (appState.equipment.length === 0) {
        alert('機材が登録されていません');
        return;
      }
      
      // ワークブックを作成
      const wb = XLSX.utils.book_new();
      
      // カテゴリーごとに分類
      const grouped = {};
      appState.equipment.forEach(eq => {
        const cat = eq.category || 'その他';
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(eq);
      });
      
      // ヘッダースタイル設定用ヘルパー
      const setHeaderStyle = (ws, range) => {
        for (let C = range.s.c; C <= range.e.c; ++C) {
          const cellAddress = XLSX.utils.encode_cell({ r: 0, c: C });
          if (!ws[cellAddress]) continue;
          ws[cellAddress].s = {
            font: { bold: true, color: { rgb: 'FFFFFF' } },
            fill: { fgColor: { rgb: 'E85D3C' } },
            alignment: { horizontal: 'center', vertical: 'center' }
          };
        }
      };
      
      // === カテゴリ別シート(全機材シートは作らない) ===
      const categoryNames = Object.keys(grouped).sort((a, b) => a.localeCompare(b, 'ja'));
      categoryNames.forEach(cat => {
        const headers = ['機材名', '在庫数', '購入日', '保存場所', '売り単価', '備考'];
        const data = [headers];
        
        // 名前順にソート
        const sorted = [...grouped[cat]].sort((a, b) => 
          (a.name || '').localeCompare(b.name || '', 'ja')
        );
        
        sorted.forEach(eq => {
          data.push([
            eq.name || '',
            eq.stock || 1,
            eq.purchaseDate || '',
            eq.location || '',
            eq.unitPrice || '',
            eq.note || ''
          ]);
        });
        
        const ws = XLSX.utils.aoa_to_sheet(data);
        ws['!cols'] = [
          { wch: 28 }, // 機材名
          { wch: 8 },  // 在庫数
          { wch: 12 }, // 購入日
          { wch: 20 }, // 保存場所
          { wch: 12 }, // 売り単価
          { wch: 30 }  // 備考
        ];
        setHeaderStyle(ws, XLSX.utils.decode_range(ws['!ref']));
        
        // シート名はExcelの制約に対応
        let sheetName = cat;
        sheetName = sheetName.replace(/[\\\/\?\*\[\]:]/g, '_');
        if (sheetName.length > 28) sheetName = sheetName.substring(0, 28);
        
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
      });
      
      // ファイル名
      const filename = `機材リスト_${formatDateForFilename()}.xlsx`;
      
      // ダウンロード
      XLSX.writeFile(wb, filename);
      alert(`Excelファイル「${filename}」をダウンロードしました\n\n${categoryNames.length}個のカテゴリーに分けて、全${appState.equipment.length}点の機材を出力しました。\n\n各シートを編集後、「📥 Excel読込」で取り込めます。`);
    }

    // === Excel Import (シート分け対応・スマート差分更新・重複自動マージ) ===
    function importExcel() {
      if (typeof XLSX === 'undefined') {
        alert('Excelライブラリが読み込まれていません。ページをリロードしてください。');
        return;
      }
      
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.xlsx,.xls';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = new Uint8Array(event.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            
            const importedItems = [];
            const sheetsProcessed = [];
            
            // 全シートを処理(全機材シートはスキップ、カテゴリー別のみ)
            wb.SheetNames.forEach(sheetName => {
              // スキップ対象: 全機材、凡例、集計、_で始まるシート
              if (sheetName.includes('全機材') || 
                  sheetName.includes('凡例') || 
                  sheetName.includes('集計') ||
                  sheetName.startsWith('_')) {
                return;
              }
              
              const ws = wb.Sheets[sheetName];
              const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
              if (json.length < 2) return;
              
              // シート名 = カテゴリ名(絵文字や記号を除去)
              const category = sheetName.replace(/[📋📦📊📈📉💼🏷️]/g, '').trim() || 'その他';
              sheetsProcessed.push(category);
              
              for (let i = 1; i < json.length; i++) {
                const row = json[i];
                if (!row[0]) continue; // 機材名が空ならスキップ
                
                importedItems.push({
                  name: String(row[0]).trim(),
                  category: category,
                  stock: row[1] !== '' ? parseInt(row[1]) : null,
                  purchaseDate: String(row[2] || '').trim(),
                  location: String(row[3] || '').trim(),
                  unitPrice: row[4] !== '' ? parseInt(row[4]) : null,
                  note: String(row[5] || '').trim()
                });
              }
            });
            
            if (importedItems.length === 0) {
              alert('読み込めるデータが見つかりませんでした\n\nExcelファイルのシート名がカテゴリ名と一致していることを確認してください。');
              return;
            }
            
            // Excel内の重複を自動マージ(機材名で判定)
            const dedupedItems = [];
            const seenNames = new Map();
            let duplicateCount = 0;
            
            importedItems.forEach(item => {
              if (seenNames.has(item.name)) {
                // 重複あり → 後のものを採用(上書き)
                const idx = seenNames.get(item.name);
                dedupedItems[idx] = item;
                duplicateCount++;
              } else {
                seenNames.set(item.name, dedupedItems.length);
                dedupedItems.push(item);
              }
            });
            
            if (duplicateCount > 0) {
              const msg = `Excelファイル内に同名の機材が${duplicateCount}件見つかりました。\n` +
                          `重複は自動的に統合され、${dedupedItems.length}件の機材として読み込みます。\n\n続行しますか?`;
              if (!confirm(msg)) return;
            }
            
            // モード選択ダイアログ
            showImportModeDialog(dedupedItems);
          } catch (err) {
            console.error('Excel読み込みエラー:', err);
            alert('Excelファイルの読み込みに失敗しました。\nファイル形式を確認してください。');
          }
        };
        reader.readAsArrayBuffer(file);
      };
      input.click();
    }

    function executeImport(mode, importedItems) {
      // JSON でエンコードされていない場合はそのまま使う
      if (typeof importedItems === 'string') {
        try {
          importedItems = JSON.parse(importedItems);
        } catch (e) {}
      }
      
      if (mode === 'smart') {
        // スマート更新: 機材名で照合、変更フィールドのみ更新
        let updated = 0;
        let added = 0;
        let updatedFields = [];
        
        importedItems.forEach(imp => {
          const existing = appState.equipment.find(eq => eq.name === imp.name);
          
          if (existing) {
            // 既存機材 → 差分更新
            const changes = [];
            
            // 各フィールドをチェック(空欄でない場合のみ更新)
            if (imp.category && imp.category !== existing.category) {
              changes.push(`カテゴリ: "${existing.category}" → "${imp.category}"`);
              existing.category = imp.category;
            }
            if (imp.stock !== null && imp.stock !== existing.stock) {
              changes.push(`在庫数: ${existing.stock} → ${imp.stock}`);
              existing.stock = imp.stock;
            }
            if (imp.purchaseDate && imp.purchaseDate !== existing.purchaseDate) {
              changes.push(`購入日: "${existing.purchaseDate || ''}" → "${imp.purchaseDate}"`);
              existing.purchaseDate = imp.purchaseDate;
            }
            if (imp.location && imp.location !== existing.location) {
              changes.push(`保存場所: "${existing.location || ''}" → "${imp.location}"`);
              existing.location = imp.location;
            }
            if (imp.unitPrice !== null && imp.unitPrice !== (existing.unitPrice || 0)) {
              changes.push(`売り単価: ${existing.unitPrice || 0} → ${imp.unitPrice}`);
              existing.unitPrice = imp.unitPrice;
            }
            if (imp.note && imp.note !== existing.note) {
              changes.push(`備考: "${existing.note || ''}" → "${imp.note}"`);
              existing.note = imp.note;
            }
            
            if (changes.length > 0) {
              updated++;
              updatedFields.push(`【${imp.name}】 ${changes.join(', ')}`);
            }
          } else {
            // 新規追加
            appState.equipment.push({
              id: Date.now().toString() + Math.random(),
              name: imp.name,
              category: imp.category || 'その他',
              stock: imp.stock || 1,
              purchaseDate: imp.purchaseDate || '',
              location: imp.location || '',
              unitPrice: imp.unitPrice || 0,
              note: imp.note || '',
              photo: ''
            });
            added++;
          }
        });
        
        saveState();
        renderEquipment();
        
        // 結果を表示
        showImportResult(updated, added, updatedFields);
        
      } else if (mode === 'add') {
        // 全件追加
        importedItems.forEach(imp => {
          appState.equipment.push({
            id: Date.now().toString() + Math.random(),
            name: imp.name,
            category: imp.category || 'その他',
            stock: imp.stock || 1,
            purchaseDate: imp.purchaseDate || '',
            location: imp.location || '',
            unitPrice: imp.unitPrice || 0,
            note: imp.note || '',
            photo: ''
          });
        });
        saveState();
        renderEquipment();
        alert(`${importedItems.length}点の機材を新規追加しました`);
        
      } else if (mode === 'replace') {
        // 完全置き換え
        if (!confirm('⚠️ 本当に既存の機材リストをすべて削除しますか?\n\n※既存データは消去されます。事前にバックアップを取ることを推奨します。')) {
          return;
        }
        
        appState.equipment = importedItems.map(imp => ({
          id: Date.now().toString() + Math.random(),
          name: imp.name,
          category: imp.category || 'その他',
          stock: imp.stock || 1,
          purchaseDate: imp.purchaseDate || '',
          location: imp.location || '',
          unitPrice: imp.unitPrice || 0,
          note: imp.note || '',
          photo: ''
        }));
        
        saveState();
        renderEquipment();
        alert(`${importedItems.length}点の機材で置き換えました`);
      }
    }

    // === CSV Export/Import ===
    function exportCSV(type) {
      let csv = '';
      let filename = '';

      if (type === 'equipment') {
        csv = '機材名,カテゴリ,在庫数,購入日,保存場所,備考\n';
        appState.equipment.forEach(eq => {
          csv += `"${escapeCSV(eq.name)}","${escapeCSV(eq.category)}",${eq.stock},"${escapeCSV(eq.purchaseDate || '')}","${escapeCSV(eq.location || '')}","${escapeCSV(eq.note || '')}"\n`;
        });
        filename = `機材リスト_${formatDateForFilename()}.csv`;
      } else if (type === 'users') {
        csv = 'ユーザー名,色\n';
        appState.users.forEach(u => {
          csv += `"${escapeCSV(u.name)}","${u.color}"\n`;
        });
        filename = `ユーザーリスト_${formatDateForFilename()}.csv`;
      } else if (type === 'reservations') {
        csv = '案件名,利用者,機材名,開始日,終了日,ステータス,備考\n';
        appState.reservations.forEach(r => {
          const status = r.status === 'tentative' ? '仮押さえ' : '決定';
          csv += `"${escapeCSV(r.projectName || '')}","${escapeCSV(r.userName)}","${escapeCSV(r.equipmentName)}","${r.startDate}","${r.endDate}","${status}","${escapeCSV(r.notes || '')}"\n`;
        });
        filename = `予約リスト_${formatDateForFilename()}.csv`;
      }

      // BOM 付きで保存(Excelで日本語が正しく表示されるように)
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function escapeCSV(str) {
      if (!str) return '';
      return String(str).replace(/"/g, '""');
    }

    function formatDateForFilename() {
      const d = new Date();
      return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    }

    function importCSV(type) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.csv';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          let text = event.target.result;
          // BOMを除去
          if (text.charCodeAt(0) === 0xFEFF) text = text.substring(1);
          
          const lines = text.split(/\r?\n/).filter(l => l.trim());
          if (lines.length < 2) {
            alert('CSVファイルにデータがありません');
            return;
          }

          const header = lines[0];
          const dataLines = lines.slice(1);

          if (type === 'equipment') {
            if (!confirm(`${dataLines.length}件の機材を読み込みます。既存のデータに追加されます。よろしいですか?`)) return;
            
            dataLines.forEach(line => {
              const cols = parseCSVLine(line);
              if (cols.length >= 3) {
                appState.equipment.push({
                  id: Date.now().toString() + Math.random(),
                  name: cols[0],
                  category: cols[1],
                  stock: parseInt(cols[2]) || 1,
                  purchaseDate: cols[3] || '',
                  location: cols[4] || '',
                  note: cols[5] || ''
                });
              }
            });
          } else if (type === 'users') {
            if (!confirm(`${dataLines.length}件のユーザーを読み込みます。既存のデータに追加されます。よろしいですか?`)) return;
            
            dataLines.forEach(line => {
              const cols = parseCSVLine(line);
              if (cols.length >= 1) {
                appState.users.push({
                  id: Date.now().toString() + Math.random(),
                  name: cols[0],
                  color: cols[1] || COLOR_OPTIONS[0]
                });
              }
            });
          } else if (type === 'reservations') {
            if (!confirm(`${dataLines.length}件の予約を読み込みます。既存のデータに追加されます。よろしいですか?`)) return;
            
            dataLines.forEach(line => {
              const cols = parseCSVLine(line);
              if (cols.length >= 6) {
                const eq = appState.equipment.find(e => e.name === cols[2]);
                const user = appState.users.find(u => u.name === cols[1]);
                appState.reservations.push({
                  id: Date.now().toString() + Math.random(),
                  projectName: cols[0],
                  userName: cols[1],
                  userId: user ? user.id : '',
                  equipmentName: cols[2],
                  equipmentId: eq ? eq.id : '',
                  startDate: cols[3],
                  endDate: cols[4],
                  status: cols[5] === '決定' ? 'confirmed' : 'tentative',
                  notes: cols[6] || ''
                });
              }
            });
          }

          saveState();
          render();
          alert('読み込みが完了しました');
        };
        reader.readAsText(file, 'UTF-8');
      };
      input.click();
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          if (inQuotes && line[i+1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current);
      return result;
    }

    // === JSON Full Backup ===
    function exportJSON() {
      const data = {
        version: '2.0',
        exportDate: new Date().toISOString(),
        equipment: appState.equipment,
        users: appState.users,
        reservations: appState.reservations
      };

      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `機材管理_完全バックアップ_${formatDateForFilename()}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      alert('完全バックアップが作成されました!\n(機材・写真・ユーザー・予約 すべて含まれます)');
    }

    function importJSON() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);

            if (!data.version || !data.equipment) {
              alert('正しいバックアップファイルではありません');
              return;
            }

            const eqCount = (data.equipment || []).length;
            const userCount = (data.users || []).length;
            const resCount = (data.reservations || []).length;

            if (!confirm(
              `バックアップから復元しますか?\n\n` +
              `機材: ${eqCount}件\n` +
              `ユーザー: ${userCount}件\n` +
              `予約: ${resCount}件\n\n` +
              `現在のデータはすべて上書きされます。よろしいですか?`
            )) return;

            appState.equipment = data.equipment || [];
            appState.users = data.users || [];
            appState.reservations = data.reservations || [];

            saveState();
            render();
            alert('復元が完了しました!');
          } catch (err) {
            alert('ファイルの読み込みに失敗しました: ' + err.message);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function closeModal() {
      const m = document.getElementById('res-modal') || document.querySelector('.modal-overlay');
      if (m) m.remove();
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyStoredFontScale();
      initAuth();
    });
  </script>
</body>
</html>
