    // 「現在地」を予約データから動的に計算する
    // 機材ごとに、今日(または指定日)時点で最後に使用された予約の返却先を返す
    // 返却先が空欄 or ホーム と同じ → ホーム扱い(空文字を返す)
    // 返却先が指定されている → 持ち出し中(その場所を返す)
    function getEquipmentCurrentLocation(eqId, referenceDate) {
      const today = referenceDate || new Date();
      // 時刻の影響を除く(日付のみで比較)
      const todayStr = today.toISOString().split('T')[0];
      const todayDate = new Date(todayStr + 'T00:00:00');
      
      const eq = appState.equipment.find(e => e.id === eqId);
      if (!eq) return '';
      const homeLocation = (eq.location || '').trim();
      
      // この機材の予約のうち、「使用終了日 or 返却予定日」が今日以前のものを抽出
      // 終了日が今日と同じ場合も「すでに終了した」とみなす
      const pastReservations = appState.reservations.filter(r => {
        if (r.equipmentId !== eqId) return false;
        // 仮押さえは現在地に影響しない(キャンセルされる可能性が高い)
        if (r.status === 'tentative') return false;
        // 返却予定日があればそれ、なければ使用終了日を基準に
        const endDateStr = r.returnDate || r.endDate;
        if (!endDateStr) return false;
        const endDate = new Date(endDateStr + 'T00:00:00');
        return endDate <= todayDate;
      });
      
      if (pastReservations.length === 0) {
        // 過去の使用履歴なし → ホーム
        return '';
      }
      
      // 直近の予約を取得(使用終了日が一番新しいもの、同日なら returnDate が新しい方)
      pastReservations.sort((a, b) => {
        const aEnd = a.returnDate || a.endDate;
        const bEnd = b.returnDate || b.endDate;
        return bEnd.localeCompare(aEnd);
      });
      const latest = pastReservations[0];
      
      const returnLoc = (latest.returnLocation || '').trim();
      
      // 返却先が空欄 = ホームに戻った
      if (!returnLoc) return '';
      // 返却先がホームと同じ場合 = ホームにいる
      if (returnLoc === homeLocation) return '';
      
      return returnLoc;
    }
    
    // 「現在地」を取得して、ホーム以外なら表示用文字列を返す
    // 戻り値: 持ち出し中なら場所名、ホームなら空文字
    function getDisplayLocation(eq) {
      if (!eq) return '';
      return getEquipmentCurrentLocation(eq.id);
    }
    
    // 機材の使用回数を集計(全期間の予約回数 - 仮押さえも含む)
    // パフォーマンスのため、結果はキャッシュする
    let __equipmentUsageCache = null;
    let __equipmentUsageCacheKey = null;
    function getEquipmentUsageCounts() {
      // キャッシュキー: 予約データの変更を簡易検出
      const key = appState.reservations.length + ':' + (appState.reservations[appState.reservations.length-1]?.id || '');
      if (__equipmentUsageCache && __equipmentUsageCacheKey === key) {
        return __equipmentUsageCache;
      }
      const counts = {};
      appState.reservations.forEach(r => {
        if (!r.equipmentId) return;
        counts[r.equipmentId] = (counts[r.equipmentId] || 0) + 1;
      });
      __equipmentUsageCache = counts;
      __equipmentUsageCacheKey = key;
      return counts;
    }
    
    // 単一機材の使用回数を取得
    function getUsageCount(eqId) {
      const counts = getEquipmentUsageCounts();
      return counts[eqId] || 0;
    }
    
    // 「現在地」候補リストを取得(既存機材の location, 予約の returnLocation から)
    function getLocationSuggestions() {
      const set = new Set();
      appState.equipment.forEach(eq => {
        if (eq.currentLocation && eq.currentLocation.trim()) set.add(eq.currentLocation.trim());
        if (eq.location && eq.location.trim()) set.add(eq.location.trim());
      });
      // 予約データからも候補を集める
      appState.reservations.forEach(r => {
        if (r.returnLocation && r.returnLocation.trim()) set.add(r.returnLocation.trim());
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, 'ja'));
    }
    
    // 機材をホームに戻す(過去の returnLocation を持つ予約を見つけて修正)
    function returnToHome(idx) {
      if (!isAdmin()) { alert('機材の編集には管理者権限が必要です'); return; }
      const eq = appState.equipment[idx];
      if (!eq) return;
      const currentLoc = getDisplayLocation(eq);
      if (!currentLoc) {
        alert(`「${eq.name}」は既にホームにあります`);
        return;
      }
      
      // 「最も直近の」過去予約(currentLoc の原因となっているもの)を見つける
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];
      const todayDate = new Date(todayStr + 'T00:00:00');
      
      const pastReservations = appState.reservations.filter(r => {
        if (r.equipmentId !== eq.id) return false;
        if (r.status === 'tentative') return false;
        const endDateStr = r.returnDate || r.endDate;
        if (!endDateStr) return false;
        return new Date(endDateStr + 'T00:00:00') <= todayDate;
      });
      pastReservations.sort((a, b) => {
        const aEnd = a.returnDate || a.endDate;
        const bEnd = b.returnDate || b.endDate;
        return bEnd.localeCompare(aEnd);
      });
      
      if (pastReservations.length === 0) {
        alert(`「${eq.name}」をホームに戻すための該当予約が見つかりません`);
        return;
      }
      
      const latest = pastReservations[0];
      if (!confirm(`「${eq.name}」をホーム(${eq.location || '未設定'})に戻しますか?\n\n対象予約: ${latest.projectName || '(案件名なし)'}\n返却先: ${latest.returnLocation || ''} → (空欄=ホーム)に変更します。`)) return;
      
      // 直近予約の returnLocation を空欄にする → ホーム扱い
      const resIdx = appState.reservations.findIndex(r => r.id === latest.id);
      if (resIdx >= 0) {
        appState.reservations[resIdx].returnLocation = '';
        saveState();
        renderEquipment();
        alert(`「${eq.name}」をホームに戻しました`);
      }
    }

    // 画像自動リサイズ機能(最大400px、JPEG圧縮)
    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // リサイズ計算
          const MAX_SIZE = 400;
          let width = img.width;
          let height = img.height;
          
          if (width > height) {
            if (width > MAX_SIZE) {
              height = height * (MAX_SIZE / width);
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width = width * (MAX_SIZE / height);
              height = MAX_SIZE;
            }
          }

          // Canvas でリサイズ
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // JPEG 0.8 品質で出力
          const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.8);

          // プレビューと隠しフィールドに保存
          document.getElementById('photo-preview').innerHTML = `<img src="${resizedDataUrl}" alt="preview"/>`;
          document.getElementById('photo-data').value = resizedDataUrl;
          
          // 「写真を削除」ボタンを追加
          const btnContainer = document.querySelector('.photo-preview').parentNode.querySelector('div[style*="display: flex"]');
          if (!btnContainer.querySelector('.btn-remove-photo')) {
            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'btn btn-small btn-remove-photo';
            removeBtn.textContent = '写真を削除';
            removeBtn.onclick = removePhoto;
            btnContainer.appendChild(removeBtn);
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

      document.getElementById('photo-preview').innerHTML = '<span class="photo-placeholder">📷 写真を選択</span>';
      document.getElementById('photo-data').value = '';

    function showReservationStep() {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'res-modal';

      if (appState.reservationStep === 1) {
        const isEditing = appState.editingProjectId !== null;
        const stepTitle = isEditing ? '✏️ 予定を修正 - Step 1: 機材を編集' : 'Step 1: 機材を選択';
        
        // 選択リストを正規化(旧形式の文字列IDを新形式の{id,qty}に統一)
        normalizeSelectedEq();
        
        // 「目次」カテゴリは予約対象外なので、ここから除外
        const reservableEquipment = appState.equipment.filter(eq => 
          (eq.category || '').trim() !== '目次'
        );
        
        const categories = ['all', ...new Set(reservableEquipment.map(eq => eq.category).filter(Boolean))];
        
        // カテゴリーフィルター適用(目次は予約対象外)
        let filteredEquipment = appState.equipmentFilter === 'all' || appState.equipmentFilter === '目次'
          ? [...reservableEquipment]
          : reservableEquipment.filter(eq => eq.category === appState.equipmentFilter);
        
        // 検索キーワード適用(機材名・カテゴリ・備考・保存場所を対象、部分一致)
        const resKeyword = (appState.equipmentSearchKeyword || '').trim();
        if (resKeyword) {
          const normalize = (s) => {
            if (!s) return '';
            let r = String(s).toLowerCase();
            // 全角英数記号(U+FF01-U+FF5E)を半角に変換
            r = r.replace(/[\uFF01-\uFF5E]/g, ch => 
              String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
            // ひらがな(U+3041-U+3096)→カタカナ(U+30A1-U+30F6)
            r = r.replace(/[\u3041-\u3096]/g, ch => 
              String.fromCharCode(ch.charCodeAt(0) + 0x60));
            return r;
          };
          const normalizedKw = normalize(resKeyword);
          const keywords = normalizedKw.split(/\s+/).filter(Boolean);
          
          // デバッグ: 検索の状況をコンソールに出力
          console.log('🔍 [予約モーダル検索]', {
            入力キーワード: resKeyword,
            正規化後: normalizedKw,
            分割キーワード: keywords,
            検索対象件数: filteredEquipment.length
          });
          // 最初の3件のサンプル表示
          if (filteredEquipment.length > 0) {
            console.log('検索対象サンプル(最初の3件):');
            filteredEquipment.slice(0, 3).forEach(eq => {
              const target = normalize((eq.name||'') + ' ' + (eq.category||'') + ' ' + (eq.note||'') + ' ' + (eq.location||''));
              console.log(`  「${eq.name}」(カテゴリ: ${eq.category}) → 正規化: "${target}"`);
            });
          }
          
          filteredEquipment = filteredEquipment.filter(eq => {
            // 各フィールドを個別に正規化
            const fields = {
              name: normalize(eq.name || ''),
              category: normalize(eq.category || ''),
              note: normalize(eq.note || ''),
              location: normalize(eq.location || ''),
              currentLocation: normalize(getDisplayLocation(eq))
            };
            // 連結文字列でAND判定
            const fullTarget = Object.values(fields).join(' ');
            const isMatch = keywords.every(kw => fullTarget.includes(kw));
            if (!isMatch) return false;
            
            // マッチした箇所を記録(表示用)
            const matchInfo = {
              name: false,
              category: false,
              note: false,
              location: false
            };
            keywords.forEach(kw => {
              if (fields.name.includes(kw)) matchInfo.name = true;
              if (fields.category.includes(kw)) matchInfo.category = true;
              if (fields.note.includes(kw)) matchInfo.note = true;
              if (fields.location.includes(kw) || fields.currentLocation.includes(kw)) matchInfo.location = true;
            });
            eq.__matchInfo = matchInfo; // 一時的にマッチ情報を保持(レンダリング後にクリア推奨だが運用上問題なし)
            return true;
          });
          
          console.log('🔍 検索結果:', filteredEquipment.length + '件', filteredEquipment.slice(0, 5).map(e => e.name));
        } else {

            break;

                      onkeyup="if (event.key === 'Enter' || event.keyCode === 13) { window.__imeComposing = false; updateResEquipmentSearch(event.target.value); }"
                      id="res-equipment-search-input"
                    />
                    ${appState.equipmentSearchKeyword ? 
                      '<button class="equipment-search-clear" onclick="clearResEquipmentSearch()" title="クリア">✕</button>' : ''
                    }
                  </div>
                  ${resKeyword ? (() => {
                    const summary = { name: 0, category: 0, note: 0, location: 0 };
                    filteredEquipment.forEach(eq => {
                      if (eq.__matchInfo) {
                        if (eq.__matchInfo.name) summary.name++;
                        if (eq.__matchInfo.category) summary.category++;
                        if (eq.__matchInfo.note) summary.note++;
                        if (eq.__matchInfo.location) summary.location++;
                      }
                    });
                    const parts = [];
                    if (summary.name > 0) parts.push(`機材名 ${summary.name}`);
                    if (summary.category > 0) parts.push(`カテゴリ ${summary.category}`);
                    if (summary.note > 0) parts.push(`備考 ${summary.note}`);
                    return `
                      <div style="font-size: 10px; color: var(--text-mute); margin-top: 6px;">
                        ${filteredEquipment.length}件: ${parts.join(' / ')}

                  })() : ''}
                </div>
                
                <h4 style="margin-top: 12px;">📂 カテゴリ</h4>

                  </div>
                  <div class="view-controls">
                    <select class="sort-select" onchange="setEquipmentSortInModal(this.value)">

                ${filteredEquipment.length === 0 ? `

                  // 備考にマッチした場合は備考の抜粋も表示

                          <td style="text-align: center;">
                            ${sel && hasMultipleStock ? `
                              <div style="display: inline-flex; align-items: center; gap: 4px;">
                                <button onclick="decreaseResEqQty('${eq.id}', event)" style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--accent); background: white; color: var(--accent); font-size: 14px; font-weight: 700; cursor: pointer; line-height: 1; padding: 0;">−</button>
                                <span style="font-weight: 700; min-width: 20px; text-align: center; color: var(--accent);">${qty}</span>
                                <button onclick="increaseResEqQty('${eq.id}', event)" style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--accent); background: ${qty >= maxStock ? '#f5f1ea' : 'var(--accent)'}; color: ${qty >= maxStock ? '#ccc' : 'white'}; font-size: 14px; font-weight: 700; cursor: ${qty >= maxStock ? 'not-allowed' : 'pointer'}; line-height: 1; padding: 0;" ${qty >= maxStock ? 'disabled' : ''}>＋</button>
                              </div>
                            ` : sel ? '<span style="font-size: 20px; color: var(--accent); cursor: pointer;" onclick="toggleResEq(\'' + eq.id + '\')">✓</span>' : '<span style="color: var(--text-mute); cursor: pointer;" onclick="toggleResEq(\'' + eq.id + '\')">選択</span>'}
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            `}
              </div>
              
              <!-- 右カラム: 選択中の機材 -->
              <div class="step1-col-right">
                <h4>📦 選択中 (${appState.reservationSelectedEq.length}種類 / 合計${appState.reservationSelectedEq.reduce((sum, x) => sum + (x.qty||1), 0)}台)
                  ${appState.reservationSelectedEq.length > 0 ? `
                    <button onclick="clearAllSelectedEq()" style="float: right; background: transparent; border: 1px solid #c93838; color: #c93838; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: 700; letter-spacing: 0.5px;" title="選択をすべて解除">🗑️ クリア</button>
                  ` : ''}
                </h4>
                <div class="selected-items-list" style="flex: 1; min-height: 100px; max-height: none; overflow-y: auto;">
                  ${appState.reservationSelectedEq.length === 0 ?
                    '<div style="text-align: center; padding: 30px 10px; color: var(--text-mute); font-size: 12px;">機材を<br/>選択してください</div>' :
                    appState.reservationSelectedEq.map(item => {
                      const eqId = item.id;
                      const qty = item.qty || 1;
                      const eq = appState.equipment.find(e => e.id === eqId);
                      if (!eq) return `<div class="selected-item-row"><span style="color: var(--text-mute);"><strong>?</strong> (削除済み)</span><button class="selected-item-remove" onclick="toggleResEq('${eqId}')" title="削除">✕</button></div>`;
                      const maxStock = eq.stock || 1;
                      const hasMultipleStock = maxStock > 1;
                      return `
                        <div class="selected-item-row">
                          <div class="selected-item-info">
                            <strong>✓</strong> ${eq.name}
                            <span class="selected-item-qty-badge">×${qty}</span>
                          </div>
                          <div class="selected-item-controls">
                            ${hasMultipleStock ? `
                              <button class="selected-item-qty-btn" onclick="decreaseResEqQty('${eqId}', event)" title="個数を減らす">−</button>
                              <span class="selected-item-qty-display">${qty}</span>
                              <button class="selected-item-qty-btn" onclick="increaseResEqQty('${eqId}', event)" ${qty >= maxStock ? 'disabled' : ''} title="${qty >= maxStock ? '在庫上限' : '個数を増やす'}">＋</button>
                            ` : ''}
                            <button class="selected-item-remove" onclick="toggleResEq('${eqId}')" title="削除">✕</button>
                          </div>
                        </div>
                      `;
                    }).join('')
                  }
                </div>
                <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px;">
                  ${(appState.equipmentSets || []).length > 0 ? `
                    <select onchange="loadEquipmentSet(this.value); this.value='';" style="padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); font-size: 11px; width: 100%;">
                      <option value="">📂 セットから選択...</option>
                      ${(appState.equipmentSets || []).map(s => `<option value="${s.id}">${s.name} (${s.equipmentIds.length}点)</option>`).join('')}
                    </select>
                  ` : ''}
                  ${appState.reservationSelectedEq.length > 0 ? `
                    <button class="btn-secondary" style="padding: 6px 10px; font-size: 11px;" onclick="saveAsEquipmentSet()">💾 セットとして保存</button>
                  ` : ''}
                  ${(appState.equipmentSets || []).length > 0 ? `
                    <button class="btn-secondary" style="padding: 6px 10px; font-size: 11px;" onclick="manageEquipmentSets()">⚙️ セット管理</button>
                  ` : ''}
                </div>
              </div>
            </div>

            <div class="modal-sticky-footer">
              <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
              <div class="selected-count">
                📦 選択中: <strong>${appState.reservationSelectedEq.length}</strong>種類 / 合計 <strong>${appState.reservationSelectedEq.reduce((sum, x) => sum + (x.qty||1), 0)}</strong>台
              </div>
              <button class="btn-submit" onclick="goToResStep(2)" ${appState.reservationSelectedEq.length === 0 ? 'disabled' : ''}>次へ →</button>
            </div>
          </div>
        `;
      } else if (appState.reservationStep === 2) {
        const month = appState.modalCalendarMonth.getMonth();
        const year = appState.modalCalendarMonth.getFullYear();
        const daysInMonth = getDaysInMonth(appState.modalCalendarMonth);
        const firstDay = getFirstDayOfMonth(appState.modalCalendarMonth);
        const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

        let calHtml = `
          <div class="modal-calendar">
            <div class="modal-calendar-header">
              <button onclick="modalCalPrev()">←</button>
              <div class="modal-calendar-month">${year}年${monthNames[month]}</div>
              <button onclick="modalCalNext()">→</button>
            </div>
            <div class="modal-calendar-weekdays">
              <div class="modal-calendar-weekday">日</div>
              <div class="modal-calendar-weekday">月</div>
              <div class="modal-calendar-weekday">火</div>
              <div class="modal-calendar-weekday">水</div>
              <div class="modal-calendar-weekday">木</div>
              <div class="modal-calendar-weekday">金</div>
              <div class="modal-calendar-weekday">土</div>
            </div>
            <div class="modal-calendar-days">
        `;

        for (let i = 0; i < firstDay; i++) {
          calHtml += '<div class="modal-calendar-day other-month"></div>';
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const date = new Date(year, month, day);
          const dateStr = formatDate(date);
          const status = getReservationStatusForDay(appState.reservationSelectedEq, dateStr);

          const isStart = appState.reservationDates.start === dateStr;
          const isEnd = appState.reservationDates.end === dateStr;
          const isInRange = appState.reservationDates.start && appState.reservationDates.end &&
                           isDateInRange(dateStr, appState.reservationDates.start, appState.reservationDates.end);

          let dayClass = `modal-calendar-day ${status.status}`;
          if (isStart || isEnd) dayClass += ' selected';
          if (isInRange && !isStart && !isEnd) dayClass += ' in-range';

          calHtml += `
            <div class="${dayClass}" data-date="${dateStr}" 
                 onclick="selectResDate('${dateStr}')"
                 onmouseenter="hoverResDate('${dateStr}')"
                 onmouseleave="unhoverResDate()">
              <div class="modal-calendar-day-num">${day}</div>
              ${status.users.length > 0 ? `<div class="modal-calendar-day-users">${status.users.slice(0,2).join(',')}</div>` : ''}
            </div>
          `;
        }

        calHtml += '</div></div>';

        // 重複チェック (期間が両方選択されている場合のみ)
        let conflictHtml = '';
        let hasConflicts = false;
        if (appState.reservationDates.start) {
          // 終了日が未設定の場合は単日扱い(start = end)
          const effectiveEnd = appState.reservationDates.end || appState.reservationDates.start;
          // 編集中の場合は、編集対象の予約IDを除外
          const excludeIds = appState.editingProjectData ? appState.editingProjectData.reservationIds : null;
          const conflicts = checkConflicts(
            appState.reservationSelectedEq,
            appState.reservationDates.start,
            effectiveEnd,
            excludeIds
          );

          if (conflicts.length > 0) {
            hasConflicts = true;
            conflictHtml = `
              <div class="conflict-alert">
                <div class="conflict-alert-title">⚠️ 予約の重複があります</div>
                <div class="conflict-alert-list">
                  ${conflicts.map(c => `
                    <div class="conflict-item ${c.status === 'confirmed' ? 'confirmed' : 'tentative'}">
                      <strong>${c.equipmentName}</strong>は
                      <span style="color: var(--accent); font-weight: 700;">${c.userName}</span>が
                      <strong>${c.startDate} ～ ${c.endDate}</strong>に
                      ${c.status === 'confirmed' ? '決定予約済み' : '仮押さえ中'}
                      <div class="conflict-project">案件: ${c.projectName}</div>
                    </div>
                  `).join('')}
                </div>
                ${conflicts.some(c => c.status === 'confirmed') ? 
                  '<div class="conflict-alert-message">❌ 決定済みの予約があるため、この日程では予約できません</div>' :
                  '<div class="conflict-alert-message" style="color: #8b6f00;">⚠️ 仮押さえと重複しますが、予約は可能です</div>'
                }
              </div>
            `;
          }
        }

        // 決定済みの重複がある場合のみ「次へ」ボタンを無効化
        const hasConfirmedConflict = hasConflicts && appState.reservationDates.start && (() => {
          const effectiveEnd = appState.reservationDates.end || appState.reservationDates.start;
          const excludeIds = appState.editingProjectData ? appState.editingProjectData.reservationIds : null;
          const conflicts = checkConflicts(
            appState.reservationSelectedEq,
            appState.reservationDates.start,
            effectiveEnd,
            excludeIds
          );
          return conflicts.some(c => c.status === 'confirmed');
        })();

        modal.innerHTML = `
          <div class="modal modal-wide">
            <h2>${appState.editingProjectId ? '✏️ 予定を修正 - Step 2: 期間を編集' : 'Step 2: 期間を選択'}</h2>
            <p class="modal-subtitle">カレンダーで開始日と終了日をクリック。<b>単日予約は同じ日を2回クリック</b> または 開始日のみで「次へ」。<span style="color: #999;"> | 白:空き | 黄:仮押さえ | 赤:決定</span></p>

            <div class="date-selection-info">
              ${!appState.reservationDates.start ?
                '開始日をクリック' :
                !appState.reservationDates.end ?
                `開始日: <strong>${appState.reservationDates.start}</strong> | 終了日をクリック<span style="color: #999; margin-left: 10px;">(同じ日をもう一度クリックすると単日予約)</span> <button onclick="resetResDates()" style="margin-left: 12px; padding: 2px 10px; font-size: 11px; background: transparent; border: 1px solid #ccc; border-radius: 3px; cursor: pointer;">リセット</button>` :
                (appState.reservationDates.start === appState.reservationDates.end ?
                  `📅 単日予約: <strong>${appState.reservationDates.start}</strong> <button onclick="resetResDates()" style="margin-left: 12px; padding: 2px 10px; font-size: 11px; background: transparent; border: 1px solid #ccc; border-radius: 3px; cursor: pointer;">リセット</button>` :
                  `<strong>${appState.reservationDates.start}</strong> ～ <strong>${appState.reservationDates.end}</strong> <button onclick="resetResDates()" style="margin-left: 12px; padding: 2px 10px; font-size: 11px; background: transparent; border: 1px solid #ccc; border-radius: 3px; cursor: pointer;">リセット</button>`
                )
              }
            </div>

            <div class="step2-layout">
              <div class="step2-calendar-area">
                ${calHtml}
              </div>
              <div class="step2-info-area" id="step2-info-area">
                ${conflictHtml || `
                  <div class="info-area-placeholder">
                    💡 日付にマウスを乗せると、その日の予約状況が表示されます
                  </div>
                `}
              </div>
            </div>

            <div class="form-actions">
              <button class="btn-cancel" onclick="goToResStep(1)">← 戻る</button>
              <button class="btn-submit" onclick="proceedToStep3()" ${!appState.reservationDates.start || hasConfirmedConflict ? 'disabled' : ''}>次へ →</button>
            </div>
          </div>
        `;
      } else if (appState.reservationStep === 3) {
        const isEditing = appState.editingProjectId !== null;
        const editData = appState.editingProjectData || {};
        
        modal.innerHTML = `
          <div class="modal">
            <h2>${isEditing ? '✏️ 予定を修正 - Step 3: 詳細情報を編集' : 'Step 3: 詳細情報'}</h2>
            <form id="res-form">
              <div class="form-group">
                <label>利用者 *</label>
                <select name="username" required>
                  <option value="">選択</option>
                  ${appState.users.map(u => `
                    <option value="${u.id}|${u.name}" ${isEditing && u.name === editData.userName ? 'selected' : ''}>
                      ${u.name}
                    </option>
                  `).join('')}
                </select>
              </div>
              <div class="form-group">
                <label>案件名</label>
                <input type="text" name="projectName" value="${editData.projectName || ''}" placeholder="例: 企業CM撮影"/>
              </div>
              <div class="form-group">
                <label>📍 使用場所 <span style="font-weight: normal; color: var(--text-mute); font-size: 11px;">(任意・複数拠点運用の場合)</span></label>
                <input type="text" name="useLocation" value="${editData.useLocation || ''}" placeholder="例: 大阪、名古屋" list="use-location-suggestions"/>
                <datalist id="use-location-suggestions">
                  ${getLocationSuggestions().map(loc => `<option value="${loc}">`).join('')}
                </datalist>
                <div style="font-size: 10px; color: var(--text-mute); margin-top: 4px;">
                  💡 機材を使用する拠点(現場)を指定<br/>
                  → 機材の現在地と異なる場合は警告が出ます
                </div>
              </div>
              <div class="form-group">
                <label>返却予定日 <span style="font-weight: normal; color: var(--text-mute); font-size: 11px;">(任意・使用終了日と異なる場合のみ)</span></label>
                <input type="date" name="returnDate" value="${editData.returnDate || ''}" min="${appState.reservationDates.end}"/>
                <div style="font-size: 10px; color: var(--text-mute); margin-top: 4px;">
                  💡 使用は${appState.reservationDates.end}までで、翌日以降に返却する場合に設定<br/>
                  返却予定日まで他の人は予約できなくなります
                </div>
              </div>
              <div class="form-group">
                <label>📦 使用後の保管先 <span style="font-weight: normal; color: var(--text-mute); font-size: 11px;">(任意・別拠点に置く場合)</span></label>
                <input type="text" name="returnLocation" value="${editData.returnLocation || ''}" placeholder="例: 大阪、名古屋(空欄ならホームに戻る)" list="return-location-suggestions"/>
                <datalist id="return-location-suggestions">
                  ${getLocationSuggestions().map(loc => `<option value="${loc}">`).join('')}
                </datalist>
                <div style="font-size: 10px; color: var(--text-mute); margin-top: 4px;">
                  💡 別の拠点に置いておく場合に指定<br/>
                  → 予約終了時、選択した機材の「現在地」が自動更新されます
                </div>
              </div>
              <div class="form-group">
                <label>備考</label>
                <textarea name="notes" placeholder="情報があれば入力">${editData.notes || ''}</textarea>
              </div>
              
              <!-- レンタル機材セクション -->
              <div class="form-group">
                <label>🏷️ レンタル機材 <span style="font-weight: normal; color: var(--text-mute); font-size: 11px;">(任意)</span></label>
                <div id="rental-items-display" style="border: 1px solid var(--border); border-radius: 6px; padding: 10px; background: #f9f7f0; min-height: 40px;">
                  <!-- レンタル機材一覧をここに表示 -->
                </div>
                <button type="button" onclick="openRentalModal()" style="margin-top: 8px; padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 700;">
                  + レンタル機材を追加
                </button>
              </div>
              
              <div class="form-group">
                <label>ステータス *</label>
                <select name="status" required>
                  <option value="tentative" ${editData.status === 'tentative' ? 'selected' : ''}>仮押さえ</option>
                  <option value="confirmed" ${editData.status === 'confirmed' ? 'selected' : ''}>決定</option>
                </select>
              </div>
              <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="goToResStep(2)">← 戻る</button>
                <button type="submit" class="btn-submit">${isEditing ? '更新' : '保存'}</button>
              </div>
            </form>
          </div>
        `;

        document.body.appendChild(modal);

        // レンタル機材の初期化(編集時は既存データから、新規時は空配列)
        if (isEditing && editData.rentalItems) {
          appState.currentRentalItems = JSON.parse(JSON.stringify(editData.rentalItems));
        } else if (!appState.currentRentalItems) {
          appState.currentRentalItems = [];
        }
        renderRentalItemsDisplay();

        document.getElementById('res-form').onsubmit = (e) => {
          e.preventDefault();
          const fd = new FormData(document.getElementById('res-form'));
          const [userId, userName] = fd.get('username').split('|');

          // 最終的な重複チェック (決定済みのみ)
          const excludeIds = isEditing && editData.reservationIds ? editData.reservationIds : null;
          const conflicts = checkConflicts(
            appState.reservationSelectedEq,
            appState.reservationDates.start,
            appState.reservationDates.end,
            excludeIds
          );
          const confirmedConflicts = conflicts.filter(c => c.status === 'confirmed');

          if (confirmedConflicts.length > 0) {
            const messages = confirmedConflicts.map(c => 
              `・${c.equipmentName}は${c.userName}が${c.startDate}〜${c.endDate}に予約済み`
            ).join('\n');
            alert(`決定済みの予約と重複しているため保存できません:\n\n${messages}`);
            return;
          }

          // 編集モードの場合、既存の予約を削除
          if (isEditing && editData.reservationIds) {
            appState.reservations = appState.reservations.filter(r => !editData.reservationIds.includes(r.id));
          }

          // 使用後の保管先(現在地)を取得 - 予約データに保存し、表示は動的計算
          const returnLocationValue = (fd.get('returnLocation') || '').trim();
          // 使用場所
          const useLocationValue = (fd.get('useLocation') || '').trim();
          
          // 使用場所が指定されている場合、機材の所在との整合性をチェック
          if (useLocationValue) {
            const startDate = new Date(appState.reservationDates.start + 'T00:00:00');
            const mismatches = [];
            appState.reservationSelectedEq.forEach(item => {
              const eqId = typeof item === 'string' ? item : item.id;
              const eq = appState.equipment.find(e => e.id === eqId);
              if (!eq) return;
              // 予約開始日時点での機材の所在地を計算
              const currentLoc = getEquipmentCurrentLocation(eqId, startDate);
              const homeLoc = (eq.location || '').trim();
              const actualLoc = currentLoc || homeLoc; // 空欄ならホーム
              // 使用場所と異なる場合は不整合
              if (actualLoc && actualLoc !== useLocationValue) {
                mismatches.push({
                  name: eq.name,
                  actualLoc,
                  useLoc: useLocationValue
                });
              }
            });
            
            if (mismatches.length > 0) {
              const lines = mismatches.map(m => 
                `・${m.name}: 現在「${m.actualLoc}」にあります → 使用場所「${m.useLoc}」`
              ).join('\n');
              const proceed = confirm(
                `⚠️ 機材の所在に注意\n\n` +
                `予約開始日(${appState.reservationDates.start})時点で、以下の機材は別拠点にあります:\n\n${lines}\n\n` +
                `輸送が必要かもしれません。このまま予約を保存しますか?\n\n` +
                `[OK] 保存する\n[キャンセル] 編集に戻る`
              );
              if (!proceed) return;
            }
          }
          
          appState.reservationSelectedEq.forEach(item => {
            // 旧形式(文字列ID)と新形式({id,qty})の両方をサポート
            const eqId = typeof item === 'string' ? item : item.id;
            const qty = typeof item === 'string' ? 1 : (item.qty || 1);
            const eq = appState.equipment.find(e => e.id === eqId);
            if (!eq) return;
            
            // 個数分の予約レコードを作成(個別予約として扱う)
            for (let i = 0; i < qty; i++) {
              appState.reservations.push({
                id: Date.now().toString() + Math.random(),
                userName, userId,
                equipmentId: eqId,
                equipmentName: eq.name + (qty > 1 ? ` (${i+1}/${qty})` : ''),
                startDate: appState.reservationDates.start,
                endDate: appState.reservationDates.end,
                returnDate: fd.get('returnDate') || '',
                useLocation: useLocationValue,
                returnLocation: returnLocationValue,
                projectName: fd.get('projectName'),
                notes: fd.get('notes'),
                status: fd.get('status'),
                rentalItems: i === 0 ? (appState.currentRentalItems || []) : []  // レンタル機材は最初の1件にのみ付与
              });
            }
            // 機材の currentLocation は直接更新しない(動的計算するため)
          });

          saveState();
          
          // 編集状態をリセット
          appState.editingProjectId = null;
          appState.editingProjectData = null;
          appState.currentRentalItems = [];
          
          closeModal();
          
          if (isEditing) {
            renderReservations();
            alert('予定が更新されました');
          } else {
            switchTab('reservations');
          }
        };
        return;
      }

      document.body.appendChild(modal);
    }

    // === 機材選択ヘルパー(個数対応) ===
    // appState.reservationSelectedEq は以下の2形式を許容(後方互換):
    //   旧: [id1, id2, ...]  ← 文字列のみ(個数1扱い)
    //   新: [{id, qty}, ...]  ← オブジェクト形式
    
    // 正規化: 配列内のすべての要素を {id, qty} 形式に統一して返す
    function normalizeSelectedEq() {
      if (!Array.isArray(appState.reservationSelectedEq)) {
        appState.reservationSelectedEq = [];
        return [];
      }
      // 1要素ずつ正規化 + 重複を統合
      const map = new Map();
      appState.reservationSelectedEq.forEach(item => {
        if (typeof item === 'string') {
          // 旧形式: 文字列ID
          if (!map.has(item)) map.set(item, { id: item, qty: 1 });
        } else if (item && typeof item === 'object' && item.id) {
          // 新形式: {id, qty}
          const qty = parseInt(item.qty) || 1;
          if (map.has(item.id)) {
            map.get(item.id).qty += qty;
          } else {
            map.set(item.id, { id: item.id, qty });
          }
        }
      });
      const result = Array.from(map.values());
      appState.reservationSelectedEq = result;
      return result;
    }
    
    // 指定IDの現在の選択個数を取得(未選択なら0)
    function getSelectedQty(eqId) {
      normalizeSelectedEq();
      const item = appState.reservationSelectedEq.find(x => x.id === eqId);
      return item ? item.qty : 0;
    }
    
    // 指定IDが選択されているか
    function isSelected(eqId) {
      return getSelectedQty(eqId) > 0;
    }
    
    // 選択をトグル(カード全体クリック時)
    function toggleResEq(eqId) {
      normalizeSelectedEq();
      const idx = appState.reservationSelectedEq.findIndex(x => x.id === eqId);
      if (idx >= 0) {
        // 既に選択済み → 解除
        appState.reservationSelectedEq.splice(idx, 1);
      } else {
        // 未選択 → 個数1で追加
        appState.reservationSelectedEq.push({ id: eqId, qty: 1 });
      }
      closeModal();
      showReservationStep();
    }
    
    // 個数を増やす
    function increaseResEqQty(eqId, event) {
      if (event) { event.stopPropagation(); event.preventDefault(); }
      normalizeSelectedEq();
      const eq = appState.equipment.find(e => e.id === eqId);
      if (!eq) return;
      const maxQty = eq.stock || 1;
      
      const existing = appState.reservationSelectedEq.find(x => x.id === eqId);
      if (existing) {
        if (existing.qty < maxQty) {
          existing.qty++;
        } else {
          // 上限に達した場合のアラート(任意)
          // alert(`「${eq.name}」の在庫は${maxQty}個です`);
        }
      } else {
        appState.reservationSelectedEq.push({ id: eqId, qty: 1 });
      }
      closeModal();
      showReservationStep();
    }
    
    // 個数を減らす
    function decreaseResEqQty(eqId, event) {
      if (event) { event.stopPropagation(); event.preventDefault(); }
      normalizeSelectedEq();
      const idx = appState.reservationSelectedEq.findIndex(x => x.id === eqId);
      if (idx < 0) return;
      
      appState.reservationSelectedEq[idx].qty--;
      if (appState.reservationSelectedEq[idx].qty <= 0) {
        // 個数0で選択解除
        appState.reservationSelectedEq.splice(idx, 1);
      }
      closeModal();
      showReservationStep();
    }
    
    // 個数を直接設定(数値入力ボックス対応・今回は使わないが将来用)
    function setResEqQty(eqId, qty, event) {
      if (event) event.stopPropagation();
      normalizeSelectedEq();
      const eq = appState.equipment.find(e => e.id === eqId);
      if (!eq) return;
      const maxQty = eq.stock || 1;
      qty = Math.max(0, Math.min(maxQty, parseInt(qty) || 0));
      
      const idx = appState.reservationSelectedEq.findIndex(x => x.id === eqId);
      if (qty === 0) {
        if (idx >= 0) appState.reservationSelectedEq.splice(idx, 1);
      } else {
        if (idx >= 0) appState.reservationSelectedEq[idx].qty = qty;
        else appState.reservationSelectedEq.push({ id: eqId, qty });
      }
      closeModal();
      showReservationStep();
    }
    
    // 選択をすべてクリア
    function clearAllSelectedEq() {
      normalizeSelectedEq();
      if (appState.reservationSelectedEq.length === 0) return;
      const totalQty = appState.reservationSelectedEq.reduce((s, x) => s + (x.qty || 1), 0);
      if (!confirm(`選択中の${appState.reservationSelectedEq.length}種類(合計${totalQty}台)の機材をすべて解除しますか?`)) return;
      appState.reservationSelectedEq = [];
      closeModal();
      showReservationStep();
    }

    // ============= レンタル機材管理 =============
    function renderRentalItemsDisplay() {
      const container = document.getElementById('rental-items-display');
      if (!container) return;
      const items = appState.currentRentalItems || [];
      if (items.length === 0) {
        container.innerHTML = '<div style="color: var(--text-mute); font-size: 12px; text-align: center; padding: 10px;">レンタル機材はまだ追加されていません</div>';
        return;
      }
      container.innerHTML = items.map((item, idx) => `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; background: white; border-radius: 4px; margin-bottom: 4px; border: 1px solid var(--border);">
          <div style="flex: 1; font-size: 13px;">
            <div style="font-weight: 700;">${item.name}</div>
            <div style="font-size: 11px; color: var(--text-mute); margin-top: 2px;">
              ${item.source ? `レンタル元: ${item.source}` : ''}
              ${item.price ? ` / ¥${parseInt(item.price).toLocaleString()}` : ''}
              ${item.returnDate ? ` / 返却: ${item.returnDate}` : ''}
            </div>
          </div>
          <button type="button" onclick="removeRentalItem(${idx})" style="background: #c93838; color: white; border: none; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 11px;">削除</button>
        </div>
      `).join('');
    }

    function openRentalModal(editIdx) {
      const isEdit = typeof editIdx === 'number';
      const item = isEdit ? appState.currentRentalItems[editIdx] : { name: '', source: '', price: '', returnDate: '' };
      
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.style.zIndex = '10000';
      modal.onclick = (e) => { if (e.target === modal) closeRentalModal(); };
      modal.id = 'rental-modal-overlay';
      modal.innerHTML = `
        <div class="modal" style="max-width: 480px;">
          <h2>🏷️ レンタル機材${isEdit ? 'を編集' : 'を追加'}</h2>
          <form id="rental-item-form">
            <div class="form-group">
              <label>機材名 *</label>
              <input type="text" name="name" value="${item.name}" required placeholder="例: シネマカメラ ALEXA Mini"/>
            </div>
            <div class="form-group">
              <label>レンタル元</label>
              <input type="text" name="source" value="${item.source}" placeholder="例: 〇〇レンタル株式会社"/>

            <div class="form-group">
              <label>金額(円)</label>
              <input type="number" name="price" value="${item.price}" min="0" placeholder="例: 50000"/>

            </div>
          </form>
        </div>
      `;
      document.body.appendChild(modal);
      
      document.getElementById('rental-item-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newItem = {
          name: fd.get('name'),
          source: fd.get('source'),
          price: fd.get('price'),
          returnDate: fd.get('returnDate')
        };
        if (isEdit) {
          appState.currentRentalItems[editIdx] = newItem;
        } else {
          if (!appState.currentRentalItems) appState.currentRentalItems = [];
          appState.currentRentalItems.push(newItem);
        }
        closeRentalModal();
        renderRentalItemsDisplay();
      };

    function closeRentalModal() {
      const m = document.getElementById('rental-modal-overlay');
      if (m) m.remove();
    }

    function removeRentalItem(idx) {
      if (!confirm('このレンタル機材を削除しますか?')) return;
      appState.currentRentalItems.splice(idx, 1);
      renderRentalItemsDisplay();
    }

    // ============= 機材セット管理 =============
    function saveAsEquipmentSet() {
      normalizeSelectedEq();
      if (appState.reservationSelectedEq.length === 0) {
        alert('機材を選択してください');
        return;
      }
      const name = prompt('セット名を入力してください\n(例: イベント撮影フルセット、配信用機材)');
      if (!name || !name.trim()) return;
      
      if (!appState.equipmentSets) appState.equipmentSets = [];
      // 個数情報込みで保存
      appState.equipmentSets.push({
        id: Date.now().toString(),
        name: name.trim(),
        equipmentIds: appState.reservationSelectedEq.map(item => item.id), // 後方互換
        equipmentItems: appState.reservationSelectedEq.map(item => ({ id: item.id, qty: item.qty || 1 })), // 新形式
        createdAt: new Date().toISOString()
      });
      saveState();
      const totalQty = appState.reservationSelectedEq.reduce((s, x) => s + (x.qty || 1), 0);
      alert(`セット「${name}」を保存しました(${appState.reservationSelectedEq.length}種類 / 合計${totalQty}台)`);
      closeModal();
      showReservationStep();
    }

    function loadEquipmentSet(setId) {
      if (!setId) return;
      const set = (appState.equipmentSets || []).find(s => s.id === setId);
      if (!set) return;
      
      normalizeSelectedEq();
      
      // 個数情報がある(新形式)なら使う、なければ旧形式から推測
      const setItems = set.equipmentItems && set.equipmentItems.length > 0
        ? set.equipmentItems
        : (set.equipmentIds || []).map(id => ({ id, qty: 1 }));
      
      // 既存の機材IDのみフィルタリング(削除済みの機材を除外)
      const validItems = setItems.filter(item => appState.equipment.some(e => e.id === item.id));
      const removedCount = setItems.length - validItems.length;
      
      // 既存選択にマージ(同じIDがあれば個数を加算、ただし在庫上限まで)
      validItems.forEach(setItem => {
        const eq = appState.equipment.find(e => e.id === setItem.id);
        if (!eq) return;
        const maxStock = eq.stock || 1;
        const existing = appState.reservationSelectedEq.find(x => x.id === setItem.id);
        if (existing) {
          existing.qty = Math.min(maxStock, existing.qty + setItem.qty);
        } else {
          appState.reservationSelectedEq.push({ id: setItem.id, qty: Math.min(maxStock, setItem.qty) });
        }
      });
      
      if (removedCount > 0) {
        alert(`セット「${set.name}」を読み込みました\n(${removedCount}点は削除済みのため除外)`);
      }
      closeModal();
      showReservationStep();
    }

    function manageEquipmentSets() {
      closeModal();
      const sets = appState.equipmentSets || [];
      // 編集中のセットID
      if (!appState.editingSetId) appState.editingSetId = null;
      
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.onclick = (e) => { if (e.target === modal) { appState.editingSetId = null; closeModal(); } };
      
      // 編集中のセット
      const editingSet = appState.editingSetId ? sets.find(s => s.id === appState.editingSetId) : null;
      
      if (editingSet) {
        // ====== 編集モード(個別セットの詳細表示) ======
        const items = editingSet.equipmentItems && editingSet.equipmentItems.length > 0
          ? editingSet.equipmentItems
          : (editingSet.equipmentIds || []).map(id => ({ id, qty: 1 }));
        
        // 機材詳細を取得
        const detailedItems = items.map(item => {
          const eq = appState.equipment.find(e => e.id === item.id);
          return { ...item, eq };
        });
        
        const totalTypes = detailedItems.filter(d => d.eq).length;
        const totalQty = detailedItems.reduce((s, d) => s + (d.eq ? (d.qty || 1) : 0), 0);
        const removedCount = detailedItems.filter(d => !d.eq).length;
        
        modal.innerHTML = `
          <div class="modal modal-wide">
            <h2>📂 セット編集: ${editingSet.name}</h2>
            <p class="modal-subtitle">セット内容を編集できます。現在の予約選択には影響しません。</p>
            
            <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;">
              <button class="btn btn-small primary" onclick="renameEquipmentSet('${editingSet.id}')">📝 セット名を変更</button>
              <button class="btn btn-small" onclick="duplicateEquipmentSet('${editingSet.id}')">📋 セットを複製</button>
              <button class="btn btn-small" style="background: #c93838; color: white; border-color: #c93838; margin-left: auto;" onclick="deleteEquipmentSetWithConfirm('${editingSet.id}')">🗑️ セットを削除</button>
            </div>
            
            <div style="background: #f9f7f3; padding: 12px; border-radius: 6px; margin-bottom: 16px;">
              <div style="font-size: 12px; color: var(--text-mute); margin-bottom: 4px;">セット情報</div>
              <div style="font-weight: 700; font-size: 14px;">📦 ${totalTypes}種類 / 合計${totalQty}台</div>
              ${removedCount > 0 ? `<div style="color: #c93838; font-size: 11px; margin-top: 4px;">⚠️ ${removedCount}点は削除済みの機材です</div>` : ''}
              <div style="font-size: 11px; color: var(--text-mute); margin-top: 4px;">
                作成日: ${editingSet.createdAt ? new Date(editingSet.createdAt).toLocaleDateString('ja-JP') : '不明'}
              </div>
            </div>
            
            <h3 style="font-size: 13px; margin: 0 0 10px 0; padding-bottom: 6px; border-bottom: 1px solid var(--border);">含まれる機材</h3>
            
            <div style="max-height: 380px; overflow-y: auto; background: white; border: 1px solid var(--border); border-radius: 4px; padding: 4px; margin-bottom: 16px;">
              ${detailedItems.length === 0 ? '<div style="padding: 20px; text-align: center; color: var(--text-mute);">機材がありません</div>' :
                detailedItems.map(item => {
                  if (!item.eq) {
                    return `
                      <div class="selected-item-row" style="background: #fff5f5;">
                        <div class="selected-item-info">
                          <span style="color: #c93838;"><strong>⚠️</strong> (削除済みの機材) ID: ${item.id.substring(0, 8)}...</span>
                        </div>
                        <div class="selected-item-controls">
                          <button class="selected-item-remove" onclick="removeItemFromSet('${editingSet.id}', '${item.id}')" title="セットから削除">✕</button>
                        </div>
                      </div>
                    `;
                  }
                  const maxStock = item.eq.stock || 1;
                  const hasMultipleStock = maxStock > 1;
                  return `
                    <div class="selected-item-row">
                      <div class="selected-item-info">
                        <strong>✓</strong> ${item.eq.name}
                        <span class="selected-item-qty-badge">×${item.qty || 1}</span>
                        <span style="color: var(--text-mute); font-size: 10px; margin-left: 4px;">${item.eq.category}</span>
                      </div>
                      <div class="selected-item-controls">
                        ${hasMultipleStock ? `
                          <button class="selected-item-qty-btn" onclick="changeSetItemQty('${editingSet.id}', '${item.id}', -1)" title="個数を減らす">−</button>
                          <span class="selected-item-qty-display">${item.qty || 1}</span>
                          <button class="selected-item-qty-btn" onclick="changeSetItemQty('${editingSet.id}', '${item.id}', 1)" ${(item.qty || 1) >= maxStock ? 'disabled' : ''} title="${(item.qty || 1) >= maxStock ? '在庫上限です(' + maxStock + ')' : '個数を増やす'}">＋</button>
                        ` : ''}
                        <button class="selected-item-remove" onclick="removeItemFromSet('${editingSet.id}', '${item.id}')" title="セットから削除">✕</button>
                      </div>
                    </div>
                  `;
                }).join('')
              }
            </div>
            
            <h3 style="font-size: 13px; margin: 0 0 10px 0; padding-bottom: 6px; border-bottom: 1px solid var(--border);">機材を追加 / 置き換え</h3>
            
            <div style="background: #f9f7f3; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 12px;">
              <p style="margin: 0 0 8px 0; color: var(--text-mute);">
                💡 機材を追加するには、いったん「予約を追加」から機材を選択し、その状態でセット管理を開いてください。
              </p>
              ${appState.reservationSelectedEq && appState.reservationSelectedEq.length > 0 ? `
                <div style="margin-top: 10px; padding: 10px; background: white; border: 1px solid var(--accent); border-radius: 4px;">
                  <div style="font-weight: 700; margin-bottom: 6px;">📦 現在の選択中: ${appState.reservationSelectedEq.length}種類 / 合計${appState.reservationSelectedEq.reduce((s, x) => s + (x.qty || 1), 0)}台</div>
                  <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                    <button class="btn btn-small primary" onclick="addCurrentSelectionToSet('${editingSet.id}')">➕ このセットに追加</button>
                    <button class="btn btn-small" onclick="replaceSetWithCurrentSelection('${editingSet.id}')">🔄 現在の選択で置き換え</button>
                  </div>
                </div>
              ` : `
                <p style="margin: 0; color: var(--text-mute);">現在、機材を選択していません。</p>
              `}
            </div>
            
            <div class="form-actions">
              <button class="btn-cancel" onclick="closeSetEditor()">← セット一覧に戻る</button>
            </div>
          </div>
        `;
      } else {
        // ====== 一覧モード ======
        modal.innerHTML = `
          <div class="modal modal-wide">
            <h2>⚙️ 機材セット管理</h2>
            <p class="modal-subtitle">登録済みのセットを編集・管理できます</p>
            ${sets.length === 0 ? `
              <div style="padding: 40px; text-align: center; color: var(--text-mute);">
                <div style="font-size: 48px; margin-bottom: 12px;">📂</div>
                <p style="font-size: 14px; margin-bottom: 8px;">登録済みのセットはありません</p>
                <p style="font-size: 12px;">予約画面から機材を選んで「💾 セットとして保存」できます</p>
              </div>
            ` : `
              <div style="max-height: 480px; overflow-y: auto;">
                ${sets.map(s => {
                  const items = s.equipmentItems && s.equipmentItems.length > 0
                    ? s.equipmentItems
                    : (s.equipmentIds || []).map(id => ({ id, qty: 1 }));
                  const validItems = items.filter(item => appState.equipment.some(e => e.id === item.id));
                  const totalQty = validItems.reduce((sum, it) => sum + (it.qty || 1), 0);
                  const removed = items.length - validItems.length;
                  // 機材名のプレビュー(最初の3件)
                  const previewNames = validItems.slice(0, 3).map(item => {
                    const eq = appState.equipment.find(e => e.id === item.id);
                    return eq ? `${eq.name}${item.qty > 1 ? '×' + item.qty : ''}` : '';
                  }).filter(Boolean).join(', ');
                  const moreCount = validItems.length - 3;
                  return `
                    <div style="padding: 14px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; background: var(--panel);">
                      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                        <div style="flex: 1; min-width: 0;">
                          <div style="font-weight: 700; font-size: 14px; margin-bottom: 4px;">📂 ${s.name}</div>
                          <div style="font-size: 12px; color: var(--text-mute);">
                            ${validItems.length}種類 / 合計${totalQty}台
                            ${removed > 0 ? `<span style="color: #c93838;"> (${removed}点は削除済み)</span>` : ''}
                          </div>
                          ${previewNames ? `
                            <div style="font-size: 11px; color: var(--text-dim); margin-top: 6px;">
                              ${previewNames}${moreCount > 0 ? ` 他${moreCount}点...` : ''}
                            </div>
                          ` : ''}
                        </div>
                        <div style="display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap;">
                          <button class="btn btn-small primary" onclick="openSetEditor('${s.id}')" title="セットを編集">✏️ 編集</button>
                          <button class="btn btn-small" onclick="deleteEquipmentSet('${s.id}')" title="セットを削除" style="color: #c93838; border-color: #c93838;">🗑️</button>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
            <div class="form-actions" style="margin-top: 16px;">
              <button class="btn-cancel" onclick="closeModal(); goToResStep(1);">← 機材選択に戻る</button>
            </div>
          </div>
        `;
      }
      document.body.appendChild(modal);
    }
    
    // セット編集を開く
    function openSetEditor(setId) {
      appState.editingSetId = setId;
      closeModal();
      manageEquipmentSets();
    }
    
    // セット編集を閉じる
    function closeSetEditor() {
      appState.editingSetId = null;
      closeModal();
      manageEquipmentSets();
    }
    
    // セット名を変更
    function renameEquipmentSet(setId) {
      const set = (appState.equipmentSets || []).find(s => s.id === setId);
      if (!set) return;
      const newName = prompt('新しいセット名を入力してください', set.name);
      if (!newName || !newName.trim()) return;
      set.name = newName.trim();
      saveState();
      closeModal();
      manageEquipmentSets();
    }
    
    // セットを複製
    function duplicateEquipmentSet(setId) {
      const set = (appState.equipmentSets || []).find(s => s.id === setId);
      if (!set) return;
      const newName = prompt('複製先のセット名を入力してください', set.name + ' (コピー)');
      if (!newName || !newName.trim()) return;
      
      const items = set.equipmentItems && set.equipmentItems.length > 0
        ? set.equipmentItems
        : (set.equipmentIds || []).map(id => ({ id, qty: 1 }));
      
      const newSet = {
        id: Date.now().toString(),
        name: newName.trim(),
        equipmentIds: items.map(item => item.id),
        equipmentItems: items.map(item => ({ id: item.id, qty: item.qty || 1 })),
        createdAt: new Date().toISOString()
      };
      
      appState.equipmentSets = appState.equipmentSets || [];
      appState.equipmentSets.push(newSet);
      saveState();
      
      // 複製したセットを編集モードで開く
      appState.editingSetId = newSet.id;
      closeModal();
      manageEquipmentSets();
    }
    
    // セットを削除(編集モードから)
    function deleteEquipmentSetWithConfirm(setId) {
      const set = (appState.equipmentSets || []).find(s => s.id === setId);
      if (!set) return;
      if (!confirm(`セット「${set.name}」を削除しますか?\n\nこの操作は取り消せません。`)) return;
      appState.equipmentSets = appState.equipmentSets.filter(s => s.id !== setId);
      appState.editingSetId = null;
      saveState();
      closeModal();
      manageEquipmentSets();
    }
    
    // セットから機材を削除
    function removeItemFromSet(setId, eqId) {
      const set = (appState.equipmentSets || []).find(s => s.id === setId);
      if (!set) return;
      
      // 新形式・旧形式の両方を更新
      if (set.equipmentItems) {
        set.equipmentItems = set.equipmentItems.filter(item => item.id !== eqId);
      }
      if (set.equipmentIds) {
        set.equipmentIds = set.equipmentIds.filter(id => id !== eqId);
      }
      
      saveState();
      closeModal();
      manageEquipmentSets();
    }
    
    // セット内の機材の個数を変更
    function changeSetItemQty(setId, eqId, delta) {
      const set = (appState.equipmentSets || []).find(s => s.id === setId);
      if (!set) return;
      const eq = appState.equipment.find(e => e.id === eqId);
      if (!eq) return;
      const maxStock = eq.stock || 1;
      
      // equipmentItems を新形式に統一
      if (!set.equipmentItems || set.equipmentItems.length === 0) {
        set.equipmentItems = (set.equipmentIds || []).map(id => ({ id, qty: 1 }));
      }
      
      const item = set.equipmentItems.find(i => i.id === eqId);
      if (!item) return;
      
      const newQty = Math.max(1, Math.min(maxStock, (item.qty || 1) + delta));
      item.qty = newQty;
      
      saveState();
      closeModal();
      manageEquipmentSets();
    }
    
    // 現在の選択をセットに追加
    function addCurrentSelectionToSet(setId) {
      normalizeSelectedEq();
      if (!appState.reservationSelectedEq || appState.reservationSelectedEq.length === 0) {
        alert('追加する機材を選択してください');
        return;
      }
      const set = (appState.equipmentSets || []).find(s => s.id === setId);
      if (!set) return;
      
      if (!confirm(`現在選択中の${appState.reservationSelectedEq.length}種類の機材をセット「${set.name}」に追加しますか?\n\n同じ機材が既にある場合は個数を加算します(在庫上限まで)。`)) return;
      
      // equipmentItems を新形式に統一
      if (!set.equipmentItems || set.equipmentItems.length === 0) {
        set.equipmentItems = (set.equipmentIds || []).map(id => ({ id, qty: 1 }));
      }
      
      // 現在の選択を追加(既存があれば個数加算)
      appState.reservationSelectedEq.forEach(selItem => {
        const eq = appState.equipment.find(e => e.id === selItem.id);
        if (!eq) return;
        const maxStock = eq.stock || 1;
        const existing = set.equipmentItems.find(i => i.id === selItem.id);
        if (existing) {
          existing.qty = Math.min(maxStock, (existing.qty || 1) + (selItem.qty || 1));
        } else {
          set.equipmentItems.push({ id: selItem.id, qty: Math.min(maxStock, selItem.qty || 1) });
        }
      });
      
      // 旧形式 equipmentIds も同期
      set.equipmentIds = set.equipmentItems.map(item => item.id);
      
      saveState();
      closeModal();
      manageEquipmentSets();
    }
    
    // 現在の選択でセットを置き換え
    function replaceSetWithCurrentSelection(setId) {
      normalizeSelectedEq();
      if (!appState.reservationSelectedEq || appState.reservationSelectedEq.length === 0) {
        alert('置き換える機材を選択してください');
        return;
      }
      const set = (appState.equipmentSets || []).find(s => s.id === setId);
      if (!set) return;
      
      if (!confirm(`セット「${set.name}」の内容を、現在選択中の${appState.reservationSelectedEq.length}種類の機材で完全に置き換えますか?\n\n⚠️ 既存のセット内容は失われます。`)) return;
      
      set.equipmentItems = appState.reservationSelectedEq.map(item => ({ id: item.id, qty: item.qty || 1 }));
      set.equipmentIds = set.equipmentItems.map(item => item.id);
      
      saveState();
      closeModal();
      manageEquipmentSets();
    }

    function deleteEquipmentSet(setId) {
      const set = (appState.equipmentSets || []).find(s => s.id === setId);
      if (!set) return;
      if (!confirm(`セット「${set.name}」を削除しますか?`)) return;
      appState.equipmentSets = appState.equipmentSets.filter(s => s.id !== setId);
      saveState();
      closeModal();
      manageEquipmentSets();
    }

    function goToResStep(step) {
      appState.reservationStep = step;
      closeModal();
      showReservationStep();
    }
    
    // Step 2 から Step 3 へ進む(end未設定なら start と同じ日に自動設定 = 単日予約)
    function proceedToStep3() {
      if (!appState.reservationDates.start) return;
      if (!appState.reservationDates.end) {
        appState.reservationDates.end = appState.reservationDates.start;
      }
      goToResStep(3);

      showReservationStep();

    // 重複予約チェック関数
    function checkConflicts(equipmentIds, startDate, endDate, excludeReservationIds) {
      const conflicts = [];
      const start = dateToDateObj(startDate);
      const end = dateToDateObj(endDate);

      // equipmentIds は文字列の配列、または {id,qty} の配列の両方をサポート
      // 個数を考慮した重複チェック: 各機材について、必要個数 vs 既存予約の同期間占有数
      const requestedItems = (equipmentIds || []).map(item => {
        if (typeof item === 'string') return { id: item, qty: 1 };
        return { id: item.id, qty: item.qty || 1 };
      });

      requestedItems.forEach(req => {
        const eqId = req.id;
        const requestedQty = req.qty;
        const eq = appState.equipment.find(e => e.id === eqId);
        if (!eq) return;
        const totalStock = eq.stock || 1;

        // 同じ機材の予約をチェック
        const conflicting = appState.reservations.filter(r => {
          // 編集中の予約は除外
          if (excludeReservationIds && excludeReservationIds.includes(r.id)) return false;
          // 同じ機材かチェック
          if (r.equipmentId !== eqId) return false;
          // 期間が重複しているかチェック (返却予定日があればそれまで、なければ終了日まで)
          const rStart = dateToDateObj(r.startDate);
          const rEnd = dateToDateObj(r.returnDate || r.endDate);
          return start <= rEnd && end >= rStart;
        });

        // 同期間に既に使用されている台数の合計(機材IDで集計)
        // ※簡易版: 各予約=1台と仮定して件数で集計
        const usedQty = conflicting.length;
        const availableQty = totalStock - usedQty;
        
        // 要求個数が利用可能個数を超えている場合のみ重複として報告
        if (requestedQty > availableQty) {
          conflicting.forEach(r => {
            conflicts.push({
              equipmentName: eq.name + (requestedQty > 1 ? ` (要求:${requestedQty}台 / 在庫:${totalStock}台 / 残:${availableQty}台)` : ''),
              userName: r.userName,
              startDate: r.startDate,
              endDate: r.endDate,
              returnDate: r.returnDate,
              projectName: r.projectName || '(案件名なし)',
              status: r.status
            });
          });
        }
      });

      return conflicts;
    }

    function selectResDate(dateStr) {
      // 開始日を再クリック (開始日のみ選択中) → 単日予約として確定 (end = start)
      if (appState.reservationDates.start === dateStr && !appState.reservationDates.end) {
        appState.reservationDates.end = dateStr;
        appState.hoverDate = null;
      }
      // 終了日を再クリック → 終了日のみキャンセル
      else if (appState.reservationDates.end === dateStr && appState.reservationDates.start !== dateStr) {
        appState.reservationDates.end = null;
        appState.hoverDate = null;
      }
      // 開始日 = 終了日 (単日予約) を再クリック → 全部リセット
      else if (appState.reservationDates.start === dateStr && appState.reservationDates.end === dateStr) {
        appState.reservationDates.start = null;
        appState.reservationDates.end = null;
        appState.hoverDate = null;
      }
      // 開始日が未設定 → 設定
      else if (!appState.reservationDates.start) {
        appState.reservationDates.start = dateStr;
      }
      // 終了日が未設定 → 設定
      else if (!appState.reservationDates.end) {
        if (new Date(dateStr) < new Date(appState.reservationDates.start)) {
          appState.reservationDates.end = appState.reservationDates.start;
          appState.reservationDates.start = dateStr;
        } else {
          appState.reservationDates.end = dateStr;
        }
      }
      // 両方設定済 → 新しい開始日を設定(リセット)
      else {
        appState.reservationDates.start = dateStr;
        appState.reservationDates.end = null;
      }
      appState.hoverDate = null;
      closeModal();
      showReservationStep();
    }
    
    // 期間選択をリセット
    function resetResDates() {
      appState.reservationDates.start = null;
      appState.reservationDates.end = null;
      appState.hoverDate = null;
      closeModal();
      showReservationStep();
    }

    function hoverResDate(dateStr) {
      // 開始日が決まっていて、終了日が未確定の場合のみホバー追従
      if (appState.reservationDates.start && !appState.reservationDates.end) {
        appState.hoverDate = dateStr;
        updateCalendarHoverDisplay();
      }

      // ツールチップで重複情報を表示
      showDateTooltip(dateStr);

    function unhoverResDate() {
      appState.hoverDate = null;
      updateCalendarHoverDisplay();

    function updateCalendarHoverDisplay() {
      // 全カレンダーセルから hover-range を削除
      document.querySelectorAll('.modal-calendar-day.hover-range').forEach(el => {
        el.classList.remove('hover-range');
      });

      if (appState.reservationDates.start && !appState.reservationDates.end && appState.hoverDate) {
        // 開始日 〜 ホバー位置の範囲をハイライト
        const start = new Date(appState.reservationDates.start);
        const hover = new Date(appState.hoverDate);
        const [from, to] = start <= hover ? [start, hover] : [hover, start];

        document.querySelectorAll('.modal-calendar-day[data-date]').forEach(el => {
          const cellDate = new Date(el.dataset.date);
          if (cellDate >= from && cellDate <= to) {
            el.classList.add('hover-range');
          }
        });
      }
    }

    function showDateTooltip(dateStr) {
      // この日の予約情報を取得
      const day = dateToDateObj(dateStr);
      const dayReservations = appState.reservations.filter(r => {
        // 選択中の機材IDリスト(新形式{id,qty}に対応)
        const selectedIds = appState.reservationSelectedEq.map(x => 
          typeof x === 'string' ? x : x.id);
        if (!selectedIds.includes(r.equipmentId)) return false;
        // 編集中の予約は除外
        if (appState.editingProjectData && appState.editingProjectData.reservationIds.includes(r.id)) return false;
        return day >= dateToDateObj(r.startDate) && day <= dateToDateObj(r.endDate);
      });

      const infoArea = document.getElementById('step2-info-area');
      if (!infoArea) return;

      // 重複チェック (期間が両方選択されている場合は重複情報を維持)
      if (appState.reservationDates.start && appState.reservationDates.end) {
        // 期間が確定している場合は、既存の重複情報を表示
        return;
      }

      if (dayReservations.length === 0) {
        infoArea.innerHTML = `
          <div class="hover-info-empty">
            <div class="hover-info-date">${dateStr}</div>
            <div class="hover-info-status">✓ この日は空き</div>
          </div>
        `;
        return;
      }

      const items = dayReservations.map(r => {
        const eq = appState.equipment.find(e => e.id === r.equipmentId);
        const user = appState.users.find(u => u.name === r.userName);
        const userColor = user ? user.color : '#999';
        const statusLabel = r.status === 'confirmed' ? '決定' : '仮押さえ';
        return `<div class="hover-info-item ${r.status}">
          <div class="hover-info-equipment"><strong>${eq ? eq.name : r.equipmentName}</strong></div>
          <div class="hover-info-user">
            <span class="hover-info-color" style="background-color: ${userColor};"></span>
            ${r.userName} (${statusLabel})
          </div>
          <div class="hover-info-period">期間: ${r.startDate} ～ ${r.endDate}</div>
          ${r.projectName ? `<div class="hover-info-project">案件: ${r.projectName}</div>` : ''}
        </div>`;
      }).join('');

      infoArea.innerHTML = `
        <div class="hover-info-header">⚠️ ${dateStr} の予約状況</div>
        ${items}
      `;
    }

    function hideDateTooltip() {
      // 期間が両方選択されている場合は何もしない (重複情報を維持)
      if (appState.reservationDates.start && appState.reservationDates.end) {
        return;
      }

      const infoArea = document.getElementById('step2-info-area');
      if (infoArea) {
        infoArea.innerHTML = `
          <div class="info-area-placeholder">
            💡 日付にマウスを乗せると、その日の予約状況が表示されます
          </div>
        `;
      }
    }

    // === 重複チェック機能 ===
    function checkDuplicates() {
      // 機材名で集計
      const nameMap = {};
      appState.equipment.forEach(eq => {
        const name = eq.name;
        if (!nameMap[name]) nameMap[name] = [];
        nameMap[name].push(eq);
      });
      
      // 重複しているグループだけ抽出
      const duplicates = Object.entries(nameMap)
        .filter(([name, items]) => items.length > 1)
        .map(([name, items]) => ({ name, items }));
      
      if (duplicates.length === 0) {
        alert('✅ 重複している機材はありません!\nすべての機材名は一意です。');
        return;
      }
      
      // 重複リストを表示するモーダル
      showDuplicatesModal(duplicates);
    }

            <b>🔢 個別管理に変換(推奨):</b> α7 IV → α7 IV-01, α7 IV-02, α7 IV-03 と連番を付与<br/>

            <b>🔄 統合(在庫合算):</b> α7 IV × 3 → α7 IV(在庫3)にまとめる<br/>
            &nbsp;&nbsp;・在庫数で管理する方式<br/>
            &nbsp;&nbsp;・SDカード、ケーブル等の消耗品に最適
          </div>
          
          <div style="max-height: 50vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 8px;">

              <div style="border-bottom: 2px solid var(--border); padding: 12px 8px; ${dupIdx === duplicates.length - 1 ? 'border-bottom: none;' : ''}">
                <div style="font-weight: 700; font-size: 14px; margin-bottom: 8px; color: var(--accent);">

                    </div>

                </div>
                <div style="margin-top: 8px; text-align: right; display: flex; gap: 8px; justify-content: flex-end;">
                  <button onclick="convertToIndividual('${dup.name.replace(/'/g, "\\'")}')" style="background: #2f9e51; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">🔢 個別管理に変換</button>
                  <button onclick="mergeDuplicates('${dup.name.replace(/'/g, "\\'")}')" style="background: #4076a8; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">🔄 統合(在庫合算)</button>
